spring:
  application:
    name: studyconnect-backend
  profiles:
    active: dev
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/studyconnect}
      auto-index-creation: false
  security:
    user:
      name: disabled
      password: disabled
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:5MB}
      max-request-size: ${MAX_FILE_SIZE:5MB}

server:
  port: ${PORT:5000}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  config: classpath:logback-spring.xml

studyconnect:
  client-url: ${CLIENT_URL:http://localhost:5173}
  approved-email-domains: ${APPROVED_EMAIL_DOMAINS:college.edu}
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:development-access-secret-change-me-now-development-access-secret-change-me-now}
    refresh-secret: ${JWT_REFRESH_SECRET:development-refresh-secret-change-me-now-development-refresh-secret-change-me-now}
    access-ttl: ${ACCESS_TOKEN_TTL:PT15M}
    refresh-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:7}
  bcrypt-rounds: ${BCRYPT_ROUNDS:12}
  upload-dir: ${UPLOAD_DIR:uploads}
  cookie-secure: ${COOKIE_SECURE:false}
